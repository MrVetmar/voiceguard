name: Deploy panel to GitHub Pages

# Panel klasoru degistiginde statik paneli GitHub Pages'e yayinlar.
# Ilk kullanimdan once: Settings > Pages > Source = "GitHub Actions"

on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek dagitim; devam edenler iptal edilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: panel

      - id: deployment
        uses: actions/deploy-pages@v4
