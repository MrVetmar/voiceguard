<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceGuard Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            margin: 1rem;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"], input[type="number"], input[type="time"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 1.5rem;
        }

        .toggle-container label {
            margin-bottom: 0;
            color: var(--text);
            font-size: 1rem;
            text-transform: none;
            letter-spacing: normal;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 4px; bottom: 4px;
            background-color: var(--text-muted);
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--success);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: white;
        }

        .row {
            display: flex;
            gap: 1rem;
        }
        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            transform: translateX(150%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .notify-success { background: var(--success); }
        .notify-error { background: var(--danger); }
        
        .notification-show {
            transform: translateX(0) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VoiceGuard</h1>
        <p class="subtitle">Bot Management Dashboard</p>

        <div class="toggle-container">
            <div>
                <label for="enabledToggle">Bot Status</label>
                <span style="font-size: 0.8rem; color: var(--text-muted);">Enable/Disable voice connection</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="enabledToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Start Time</label>
                <input type="time" id="startTime">
            </div>
            <div class="form-group">
                <label>End Time</label>
                <input type="time" id="endTime">
            </div>
        </div>
        
        <div class="form-group">
            <label>Timezone</label>
            <input type="text" id="timezone" placeholder="e.g. Europe/Istanbul">
        </div>

        <div class="form-group">
            <label>Guild ID</label>
            <input type="number" id="guildId" placeholder="Server ID">
        </div>

        <div class="form-group">
            <label>Voice Channel ID</label>
            <input type="number" id="channelId" placeholder="Channel ID">
        </div>

        <div class="form-group">
            <label>Greeting Channel ID</label>
            <input type="number" id="greetingChannelId" placeholder="Text Channel ID for auto-greetings">
        </div>

        <button onclick="saveSettings()">Save Settings</button>
    </div>

    <div id="notification">Saved Successfully!</div>

    <script>
        let currentConfig = {};

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                currentConfig = config;
                
                document.getElementById('enabledToggle').checked = config.schedule?.enabled ?? true;
                document.getElementById('startTime').value = config.schedule?.start_time || '09:00';
                document.getElementById('endTime').value = config.schedule?.end_time || '23:00';
                document.getElementById('timezone').value = config.schedule?.timezone || 'Europe/Istanbul';
                document.getElementById('guildId').value = config.guild_id || '';
                document.getElementById('channelId').value = config.voice_channel_id || '';
                document.getElementById('greetingChannelId').value = config.greeting_channel_id || '';
            } catch (error) {
                showNotification('Failed to load settings!', 'error');
            }
        }

        async function saveSettings() {
            const btn = document.querySelector('button');
            btn.textContent = 'Saving...';
            btn.style.opacity = '0.7';

            currentConfig.schedule = currentConfig.schedule || {};
            currentConfig.schedule.enabled = document.getElementById('enabledToggle').checked;
            currentConfig.schedule.start_time = document.getElementById('startTime').value;
            currentConfig.schedule.end_time = document.getElementById('endTime').value;
            currentConfig.schedule.timezone = document.getElementById('timezone').value;
            
            // Allow empty ID fields so user can clear them, but save as int if provided
            const gid = document.getElementById('guildId').value;
            const cid = document.getElementById('channelId').value;
            const gcid = document.getElementById('greetingChannelId').value;
            
            if(gid) currentConfig.guild_id = parseInt(gid);
            if(cid) currentConfig.voice_channel_id = parseInt(cid);
            if(gcid) currentConfig.greeting_channel_id = parseInt(gcid);
            else delete currentConfig.greeting_channel_id;

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentConfig)
                });
                
                if (response.ok) {
                    showNotification('Settings applied instantly!', 'success');
                } else {
                    showNotification('Failed to save settings!', 'error');
                }
            } catch (error) {
                showNotification('Network error!', 'error');
            } finally {
                btn.textContent = 'Save Settings';
                btn.style.opacity = '1';
            }
        }

        function showNotification(msg, type) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.className = type === 'success' ? 'notify-success' : 'notify-error';
            el.classList.add('notification-show');
            setTimeout(() => el.classList.remove('notification-show'), 3000);
        }

        // Load config on startup
        loadConfig();
    </script>
</body>
</html>
